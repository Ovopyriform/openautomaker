profileLibraryHelp.name=設定檔名稱
profileLibraryHelp.slicerChooser=選擇想用的分層軟件
profileLibraryHelp.layerHeight=此設定每層打印之高度/厚度(即打印解析度), 用家可在0.02-0.4毫米之間選擇一個數值, 值得留意此數值會大幅影響打印時間
profileLibraryHelp.fillDensity=此數值改變填充物料量.  100%代表全實心打印而0%代表全空心打印
profileLibraryHelp.fillPattern=此設定改變中間填充式樣
profileLibraryHelp.infillEveryN=此設定強制Robox於每隔特定層數便加全實心層.  輸入0代表不使用此項
profileLibraryHelp.solidLayersTop=此設定特定最頂部為實心層數.  當最頂部為趨向平面時可能便要加多實心層數以免表面出現間隙
profileLibraryHelp.solidLayersBottom=此設定特定最底部為實心層數.  當最底部為趨向平面時可能便要加多實心層數以免表面出現間隙
profileLibraryHelp.numberOfPerimeters=此設定打印品外牆層數, 越多外圍數, 牆壁越厚
profileLibraryHelp.firstLayerExtrusionWidth=此設定第1層打印時出料闊度(毫米)
profileLibraryHelp.perimeterExtrusionWidth=此設定打印外圍時出料闊度(毫米)
profileLibraryHelp.infillExtrusionWidth=此設定打印非實心填充時之出料闊度(mm)
profileLibraryHelp.solidInfillExtrusionWidth=此設定打印實心填充時之出料闊度(mm)
profileLibraryHelp.topSolidInfillExtrusionWidth=此設定打印最頂層時之出料闊度(mm)
profileLibraryHelp.supportExtrusionWidth=此設定打印支撐物料層時之出料闊度(mm)
profileLibraryHelp.nozzleEjectionVolume=此參數設定閂針時出料總體積.  因為針本身有一定體積, 所以當閂針時會排走相同體積之膠料
profileLibraryHelp.nozzlePartialOpen=此設定針閥半開之程度, 即是如果數值為0.5時, 針閥打開50%.
profileLibraryHelp.supportOverhangThreshold=此設定值為引發打印支撐點之角度.  當輸入為0即由AutoMaker自行決定
profileLibraryHelp.supportPattern=此選項讓你設定支撐物料之打印式樣 - 有些式樣可能需要少些物料及時間
profileLibraryHelp.supportPatternSpacing=此設定支撐每行出料之間之間距(毫米), 即支撐打印密度
profileLibraryHelp.supportPatternAngle=此設定支撐料之打印方向按XY面之旋轉角度
profileLibraryHelp.firstLayerSpeed=此設定第1層之打印速度(毫米/秒)
profileLibraryHelp.perimeterSpeed=此設定打印外圍時之速度(毫米/秒)
profileLibraryHelp.smallPerimeterSpeed=此設定打印細小範圍時之時速(毫米/秒).  此速度應比外圍打印速度慢.
profileLibraryHelp.externalPerimeterSpeed=此參數設定外置邊界打印速度(毫米/秒), 即打印品之最外層
profileLibraryHelp.infillSpeed=此設定中間填充打印時之速度(毫米/秒).  這數值可儘量調高, 但過快有機會會斷開做成成品有弱點
profileLibraryHelp.solidInfillSpeed=此參數設定實心填充打印速度(毫米/秒)
profileLibraryHelp.TopSolidInfillSpeed=此參數設定頂層填充打印速度(毫米/秒), 通常會較慢以完整地覆蓋之前一層從而獲得乾淨之最上層表面.  最頂數層應完美地跨越下面非實心填充層.
profileLibraryHelp.supportMaterialSpeed=此參數設定支撐料打印速度(毫米/秒).  你可以儘量調快一些.
profileLibraryHelp.raftBaseLinewidth=此設定打印基底(Raft)層第1層時之出料闊度(毫米)
profileLibraryHelp.raftAirGapLayer0=此參數設定基底層(Raft)之最頂層及打印品之第1層之間既間隙距離(毫米)
profileLibraryHelp.interfaceLayers=此設定基底層最頂部之全實心層數.
profileLibraryHelp.bridgesSpeed=此設定打印跨橋之速度(毫米/秒).  要成功橫越沒有支撐的地方主要依靠物料種類及冷卻效果, 打印太怏會斷線, 太慢則會下墜.  一般而言打印跨橋速度應比打印外圍略慢
profileLibraryHelp.interfaceSpeed=此設定打印交接面時之速度(毫米/秒)
profileLibraryHelp.gapFillSpeed=此設定小空隙之打印速度(毫米/秒).  填滿小空隙會使到打印頭快速搖動, 做成之晃動及共震均有着對打印品之重要因素.  在此輸入較小之數值可減少之因素.  設定為0則完全關閉小空隙填充.
profileLibraryHelp.enableAutoCooling=此設定用以啟動或關閉自動冷卻功能.  AutoMaker利用二擇其一之方法控制冷卻效果 - 增加風扇速度或減慢打印一層之速度.  要控制冷卻方法之選擇, 取決於以下兩個選項, '啟動風扇如打印層需時少於'及'減慢如果打印層需時少於'
profileLibraryHelp.minFanSpeed=此參數以風扇最高速度之百分比設定打印頭最低速度
profileLibraryHelp.maxFanSpeed=此參數以風扇最高速度之百分比設定打印頭最高速度
profileLibraryHelp.bridgesFanSpeed=此參數以風扇最高速度之百分比設定打印跨橋之速度
profileLibraryHelp.disableFanFirstNLayers=此設定起始指定層數打印時關掉風扇, 此會幫助打印第1層時更易貼床.  建議打印第1至2層時關掉.
profileLibraryHelp.enableFanLayerTimeBelow=此設定會將風扇速度提至最高如果打印層需時少於特定秒數
profileLibraryHelp.slowFanLayerTimeBelow=此設定會將減慢打印速度如果打印層需時少於特定秒數
profileLibraryHelp.minPrintSpeed=此設定為打印單層之最低速度(毫米/秒).
