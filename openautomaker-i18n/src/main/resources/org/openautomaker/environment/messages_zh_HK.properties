calibrationPanel.readyToBeginNozzleOffsetCalibration=如果你發現打印起初數層時出現不貼床及不穩定, 請完成此校正.\n\n打印時兩個噴咀之間會互相轉換, 當其中一個不打印時, 此噴咀會抽起離開打印範圍, 因此軟件需要知道兩個噴咀之間的高度差距. 這個測試將會校正兩個噴咀之間的高度差
