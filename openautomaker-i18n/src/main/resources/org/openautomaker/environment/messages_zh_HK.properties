filamentLibraryHelp.ambientTemp=此數值設定打印艙內溫度.  維持打印艙內溫度, 可以保持打印品溫暖以減少縮水或蹺邊情況出現.  最佳效果應為保持整體溫度直至打印完結然後整個打印品一起冷卻.  蹺邊情況的出現很可能是整個物件冷卻不均勻, 導致縮小中的部份壓向仍然暖及軟的部份
filamentLibraryHelp.material=物料種類
filamentLibraryHelp.diameter=輸入膠線直徑(毫米) - 建議使用卡尺或千分尺量度以便輸入準確數值
filamentLibraryHelp.multiplier=此數值用以補償物料之擠壓性, 當膠線通過推料器便會受到送料齒輪擠壓從而輕微改變形狀.  此會影響送料到打印頭之數量 - 越硬之物料數值設定應越接近1.
filamentLibraryHelp.feedRateMultiplier=此加乘數值用以微調出料速率 - 此數值可於打印中調整以獲得最佳之擠出物輪廓.    增加此值超過1會引致更多物料被推出, 相反亦然 - 數值2相當於雙倍物料推出.  此數值是按比例改變出膠量, 小改變效果已經很明顯的, 因此每次調整應逐少改變(如 +/-0.05).
filamentLibraryHelp.firstlayerBedTemp=此數值設定第一層打印時之床溫, 此溫度一般會設定較高溫度以達致強一點附着力, 隨後打印層可調低一點以免底層因高溫塌陷.
filamentLibraryHelp.bedTemp=此數值設定打印時之床溫, 加熱床會幫助減少蹺邊及增加一系列物料之附着力, ABS需要床溫大約110°C而PLA約需60-80°C
filamentLibraryHelp.firstLayerNozzleTemp=此數值設定第一層打印時之噴咀溫度, 此溫度一般會設定較高溫度以達致強一點附着力, 隨後打印層可調低一點.
filamentLibraryHelp.nozzleTemp=此數值設定打印時之噴咀溫度.  不同物料需用不同溫度, 這取決於物料本身之溶點(或準確一點來說為玻璃轉移溫度).  例如, 大部份ABS需要噴咀溫度240°C, 而PLA僅需200°C便可成功打印.
