filamentLibraryHelp.name=Este campo puede usarse para nombrar el perfil de material - el cual se desplegara en la pagina de Estado cuando se inserte el carrete.
filamentLibraryHelp.colour=Escoja el color del material aqui, o eliga custom para definir su propio color
