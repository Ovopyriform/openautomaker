calibrationPanel.nozzleCalibrationFailed=噴咀開合校正失敗.\n\n在聯絡我們之前, 請重覆校正以避免校正過程中遺漏了一些細節.  請確保噴咀清潔及可自由流出物料 - 如有疑問, 請再執行維護頁面之清除物料例程.\n\n如果你的產品重覆未能成功校正, 請前往http://robox.freshdesk.com參考可行辦法 - 如果你還是未能解決問題, 請於Freshdesk Portal遞交一張ticket, 我們會儘快處理你的個案.
calibrationPanel.nozzleOffsetCalibrationTitle=噴咀偏差校正
calibrationPanel.primingNozzle=填充噴咀中
calibrationPanel.readyToBeginNozzleOffsetCalibration=如果你發現打印頭數層時出現不貼床及不穩定, 請完成此校正.\n\n打印時兩個噴咀之間會互相轉換, 當其中一個不打印時, 此噴咀會抽起離開打印範圍, 因此軟件需要知道兩個噴咀之間的高度差距. 這個測試將會校正兩個噴咀之間的高度差
calibrationPanel.readyToBeginNozzleOpeningCalibration=此例程會用以校正噴咀內之針閥操作點.  韌體需知道膠料可以剛好被擠出之操作點以便有效控制膠料擠出.\n\n開始校正前, 請確保打印床沒有任何物件, 噴咀是清潔的及已裝妥SmartReel耗材卷料.  一個鑷子或小鉗可幫助清理無用之膠料.
calibrationPanel.recalibrate=重新校正
calibrationPanel.replacePEIBed=要重新放回打印床面板, 首先要將面板推入床盤, 確保面板在所有扣位之下, 然後將前扣推右, 最後放回抹片, 按下一步以完成校正
