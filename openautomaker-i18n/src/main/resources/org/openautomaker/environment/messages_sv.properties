calibrationPanel.calibrationCommencedMessageFine=AutoMaker avgör nu nålventilens öppningspunkt. Ventilen kommer att öppnas gradvis alltid då du trycker på "Inte synlig".\n\n\n\nTryck upprepade gånger på 'Inte synlig' tills materialet strömmar, tryck sedan på 'Synlig' knappen.
calibrationPanel.calibrationCommencedMessageFill=Nu fyllmunstycket - ser du material komma ut?\n\n\n\nTryck på 'Inte synligt' knappen upprepade gånger tills du ser material komma ut, tryck sedan på 'Synligt' knappen.
calibrationPanel.calibrationSucceededMessage=Kalibreringen lyckades! Skrivarhuvudet har programmerats och är färdigt för skrivning.
calibrationPanel.cancelCalibration=Avbryt
calibrationPanel.chooseCalibration=Var god och välj typen av kalibrering du kräver.
calibrationPanel.chooseNozzleOffsetMode=Välj ett alternativ
calibrationPanel.ensureHeadIsCleanBMessage=Se till att munstyckena är rena - Använd pincetten för att ta bort material från öppningarna vid bottnen så det är uppenbart att material sprutas ut när nålventilerna öppnas.
calibrationPanel.present=Synlig
calibrationPanel.headCleanCheck=Innan du fortsätter till följande steg, var god och avlägsna det utpressade materialet med hjälp av en pinsett. Klicka på Följande för att fortsätta.
calibrationPanel.heating=AutoMaker värmer nu upp skrivarhuvudet i preparation för kalibrering - var god, vänta...
calibrationPanel.initialisingOffset=Innan du startar kalibreringen, var god och avlägsna bädden genom att vrida låshandtaget (markerat) till vänster, avlägsna spetsens torkblad och sedan genom att lyfta arket och dra mot dig. Du behöver en liten bit vanligt papper för kalibreringen, en pinsett kan också vara till nytta för att avlägsna filamentrester.
calibrationPanel.insertPieceOfPaper=Lägg en pappersbit under vänstra munstycket (fin). Klicka sedan Följande, och Roboxen rör sig nedåt för att greppa papret.
calibrationPanel.isMaterialExtrudingNozzle0=Kommer material ut ur det fina (vänstra) munstycket?
calibrationPanel.isMaterialExtrudingNozzle1=Kommer material ut ur (högra) fyllningsmunstycket?
calibrationPanel.justRight=Lagom
calibrationPanel.measuringZOffset=Robox avgör nu det vertikala avståndet mellan munstycken. Var god och vänta…
calibrationPanel.moveThePaperInstruction=Använd upp och ned knapparna för att justera skrivarhuvudets höjd. Sök den lägsta punkten som tillåter papret röra sig fritt under munstyckena utan att röra dem.\n\n\n\nNär du funnit denna punkt, klicka på Följande för att slutföra kalibreringen.
calibrationPanel.notPresent=Inte synligt
calibrationPanel.nozzleCalibrationFailed=Tyvärr ser det ut som att munstycksöppningens kalibrering har misslyckats.\n\n\n\nInnan du kontaktar oss, var god och upprepa kalibreringen, och se till att du har läst och följt instruktionerna noggrant. Se till att munstyckena är rena och att materialet strömmar fritt med bra och ren utgång från båda munstyckena - om du är osäker, kör rengöringssekvensen igen (i Underhåll).\n\n\n\nOm din apparat misslyckas med kalibreringstesterna upprepade gånger,If your product repeatedly fails the calibration tests, var god och ta en titt på lösningar som du finner på http://robox.freshdesk.com - om du fortfarande inte kan lösa problemet, var god och ta upp ett supportärende, så kommer vi att kontakta er så fort vi kan.
calibrationPanel.nozzleOffsetCalibrationTitle=Kalibrering av munstycksavståndet
calibrationPanel.primingNozzle=Grundning av munstycke
calibrationPanel.readyToBeginNozzleOffsetCalibration=Om du har problem med lagrens adhesion eller om det förekommer oenligheter i tjockleken av de några första lagren, var god och utför denna kalibreringssekvens. \n\n\n\nDå skrivarhuvudet byter mellan munstyckena, lyfts munstycket som inte skriver, upp och bort ur vägen. Därmed måste programvaran veta höjdskillnaden mellan munstyckena då de är i utskriftsposition. Denna rutin kalibrerar denna lyfthöjd.
calibrationPanel.readyToBeginNozzleOpeningCalibration=Denna rutin kalibrerar skrivarhuvudets nålventiler. Programvaran måste veta när plastet börjar flöda för att kunna reglera extruderingen noggrant.\n\n\n\nInnan du påbörjar kalibreringen, se till att bädden är tom, munstyckena är rena och att SmartReel är laddat i skrivaren. En pinsett kan vara bra för att avlägsna filamentrester.
calibrationPanel.recalibrate=Återkalibrera
calibrationPanel.replacePEIBed=Placera PEI-bädden tillbaka på plats genom att först skjuta in den i facket, medan du samtidigt säkerställer att ytan är under klämmorna på alla sidor. Skjut in ända bak, och vrid sedan låshandtaget (markerat) till höger för att låsa på plats. Till sist, lägg tillbaka spetsens torkblad och klicka på Följande föratt slutföra kalibreringen.
calibrationPanel.retryCalibration=Försök igen
calibrationPanel.saveSettings=Spara inställningarna
calibrationPanel.startCalibration=Starta
calibrationPanel.stepXOf2=Steg %:er av 2
calibrationPanel.stepXOf7=Steg %:er av 7
calibrationPanel.stepXOf9=Steg %:er av 9
calibrationPanel.title=Kalibrering
calibrationPanel.tooLoose=För lös
calibrationPanel.tooTight=För hård
calibrationPanel.valvesClosedNoMaterial=Munstyckena är nu värmada, granska att munstyckena är täta när ventilen är fullt stängd.\n\n\n\nSer du material komma ut ur munstyckena?
calibrationPanel.valvesClosedNoMaterialPostCalibration=AutoMaker kontrollerar nu kalibreringen.\n\n\n\n Flöder material ut ur nåndera munstycke?
calibrationPanel.valvesOpenMaterialExtruding=Nu, munstyckena öppna - material borde komma ut ur båda munstyckena - stämmer detta?
calibrationPanel.xAndYIntroduction=Om du har problem med fyllningen och findetaljerade delar skrivs ut snett, var god och utför denna kalibreringssekvens.\n\n\n\nDenna rutin används för att ställa in munstyckenas inriktning i X- och Y-led. Detta hjälper Robox att identifiera båda munstyckenas position i förhållande till varandra.\n\n\n\nSäkra att bädden är ren och tom, att du har utfört munstyckenas öppnings- och höjdkalibrering och att SmartReel är laddat i apparaten och färdig för utskrivning. Om PLA är tillgängligt är det rekommenderat att använda det.
calibrationPanel.xAndYPrintPattern=AutoMaker skriver nu ut ett kalibreringsmönster - var god och vänta...
calibrationPanel.xAndYGetOffsets=Avlägsna utskriftsjobbet från bädden och finn den bästa inriktningen mellan utgången av båda munstyckena (fyll och fin) på X- och Y-axlarna. Ange numret och bokstaven i rutorna nedan som bäst motsvarar paren i linje för varje riktning:
calibrationPanel.xAndYPrintingCircle=Robox kontrollerar nu inriktningen genom att skriva ut en cirkel i övre vänstra hörnet.
calibrationPanel.xAndYPrintCircleCheck=Finmunstyckets kryss borde vara exakt i mitten av fyllmunstyckets kryss. Om kryssen inte är väl i linje, måste kalibreringen utföras igen. Om du är nöjd, klicka på Följande för att fortsätta.
dialogs.automakerErrorNo3DSupport=Denna maskin har inte den krävda nivån av 3D-stöd för att köra programmet. Se Lösningar-området i Robox Stödportal för mer information. Detta program kommer nu stängas.
