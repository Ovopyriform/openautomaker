calibrationPanel.ensureHeadIsCleanBMessage=Varmista että suuttimet ovat puhtaat - Käytä pinsettejä poistaaksesi materiaalia alaosan aukoista jotta on selvää että materiaalia työntyy ulos kun neulaventtiilit aukeaa.
calibrationPanel.present=Tämänhetkinen
calibrationPanel.headCleanCheck=Ennen kuin jatkat seuraavaan vaiheeseen, ole hyvä ja poista pursunut materiaali pinsettien avulla. Klikkaa Seuraava jatkaaksesi.
calibrationPanel.heating=AutoMaker lämmittää nyt tulostuspään kalibrointia varten - ole hyvä ja odota...
calibrationPanel.initialisingOffset=Ennen kalibroinnin aloittamista, ole hyvä ja poista alusta kääntämällä lukituskahvaa (korostettu) vasemmalle, poistamalla kärjen pyyhkimisterän ja sitten nostamalla  arkkia ja vetämällä itseäsi päin. Tarvitset pienen palan tavallista paperia kalibrointia varten, pinsetit ovat myös avuksi filamenttijätöksien poistamiseen.
calibrationPanel.insertPieceOfPaper=Aseta paperinpala vasemman suuttimen (hieno) alle. Klikkaa sitten Seuraava, ja Robox liikkuu alas tarttuakseen paperiin.
calibrationPanel.isMaterialExtrudingNozzle0=Tuleeko materiaalia ulos hienosta (vasemmasta) suuttimesta?
calibrationPanel.isMaterialExtrudingNozzle1=Tuleeko materiaalia ulos (oikeasta) täyttösuuttimesta?
calibrationPanel.justRight=Juuri oikea
calibrationPanel.measuringZOffset=Robox mittaa nyt suuttimien välisen korkeuseron. Ole hyvä ja odota…
calibrationPanel.moveThePaperInstruction=Käytä ylös ja alas painikkeita säätääksesi tulostuspään korkeutta. Etsi matalin kohta joka sallii paperin vapaan liikkumisen suuttimien alla koskematta niitä.\n\n\n\nKun olet löytänyt tämän kohdan, klikkaa Seuraava lopettaaksesi kalibroinnin.
calibrationPanel.notPresent=Ei nähtävissä
calibrationPanel.nozzleCalibrationFailed=Valitettavasti näyttää siltä, että suuttimen avautumisen kalibrointi on epäonnistunut.\n\nEnnen kuin otat yhteyttä meihin, ole hyvä ja toista kalibrointi, varmistaen että olet lukenut ja seurannut ohjeita huolellisesti. Varmista että suuttimet ovat puhtaat ja materiaali juoksee vapaasti, hyvällä ja puhtaalla ulostulolla molemmista suuttimista - jos epäröit, suorita puhdistussekvenssi uudelleen (Huolto).\n\n\n\nMikäli laitteesi kalibroiniti epäonnistuu toistuvasti, voit ensin hakea vastausta ongelmaasi tukisivuiltamme osoitteessa http://robox.freshdesk.com - jos et löydä ratkaisua ongelmaasi, voit lähettää meille  tukipyynnön niin otamme yhteyttä sinuun niin pian kuin voimme.
calibrationPanel.nozzleOffsetCalibrationTitle=Suutinetäisyyden kalibrointi
calibrationPanel.primingNozzle=Suuttimen pohjustus
calibrationPanel.readyToBeginNozzleOffsetCalibration=Jos sinulla on ongelmia kerroksien tarttuvuuden kanssa tai muutaman ensimmäisten kerrosten korkeuksissa on epäsäännöllisyyttä, ole hyvä ja suorita tämä kalibrointivaihe.\n\n\n\nTulostuspään vaihdellessa suuttimien välillä, suutin joka ei tulosta nostetaan ylös ja pois tulostustyön tieltä. Tämän johdosta ohjelmiston täytyy tietää suuttimien välinen korkeusero kun ne ovat tulostusasennossaan. Tämä rutiini kalibroi tämän nostokorkeuden.
calibrationPanel.readyToBeginNozzleOpeningCalibration=Tämä rutiini kalibroi tulostuspään neulaventtiilit. Laiteohjelmiston täytyy tietää milloin muovi alkaa virtaamaan voidakseen säännöstellä pursuamista tarkasti.\n\n\n\nEnnen kalibroinnin aloittamista, varmista että alusta on tyhjä, suuttimet ovat puhtaat ja SmartReel on ladattuna tulostimeen. Pinseteillä on hyvä poistaa filamenttijätökset.
calibrationPanel.recalibrate=Kalibroi uudelleen
calibrationPanel.replacePEIBed=Aseta PEI-alusta takaisin paikalleen liu'uttamalla se ensin lokeroon, samalla varmistaen että pinta on klipsien alapuolella kaikilla sivuilla. Liu'uta kokonaan taakse, ja käännä sitten lukituskahva (korostettu) oikealle lukitaksesi paikalleen. Viimeiseksi, aseta kärjen pyyhkimisterä takaisin paikalleen ja klikkaa Seuraava päättääksesi kalibroinnin.
calibrationPanel.retryCalibration=Yritä uudelleen
calibrationPanel.saveSettings=Tallenna asetukset
calibrationPanel.startCalibration=Aloita
calibrationPanel.stepXOf2=Askel %:t 2:sta
calibrationPanel.stepXOf7=Askel %:t 7:stä
