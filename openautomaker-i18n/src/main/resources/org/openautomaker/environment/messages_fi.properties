calibrationPanel.tooLoose=Liian löysä
calibrationPanel.tooTight=Liian tiukka
calibrationPanel.valvesClosedNoMaterial=Suuttimet ovat nyt lämmitetty, tarkista että suuttimet ovat tiiviit venttiilin ollessa täysin kiinni.\n\n\n\nNäetkö materiaalia tulevan ulos suuttimista?
calibrationPanel.valvesClosedNoMaterialPostCalibration=AutoMaker tarkistaa nyt kalibroinnin.\n\n\n\n Virtaako materiaalia kummastakaan suuttimesta?
calibrationPanel.valvesOpenMaterialExtruding=Nyt, suuttimet auki - materiaalia pitäisi tulla molemmista suuttimista - pitääkö paikkansa?
calibrationPanel.xAndYIntroduction=Jos sinulla on ongelmia täytön ja hienojen, yksityiskohtaisten osien tulostuessa vinoon, ole hyvä ja suorita tämä kalibrointisekvenssi.\n\n\n\nTätä rutiinia käytetään tulostussuuttimien linjauksen asettamiseksi X- ja Y-suunnassa. Tämä auttaa Roboxia tunnistamaan kummankin suuttimen sijainnin toisiinsa nähden.\n\n\n\nVarmista että alusta on puhdas ja tyhjä, olet suorittanut suuttimien aukeamis- ja korkeuskalibroinnit ja että SmartReel on ladattuna laitteeseen ja on valmis tulostamaan. Käytä PLA:ta jos mahdollista.
calibrationPanel.xAndYPrintPattern=AutoMaker tulostaa nyt kalibrointikuvion - ole hyvä ja odota...
calibrationPanel.xAndYGetOffsets=Poista tulostustyö alustalta ja hae paras mahdollinen suuntaus suuttimien välillä (hieno- ja täyttösuutin) X- ja Y-akseleilla. Syötä alla oleviin laatikoihin numero ja kirjain joka vastaa parhaiten linjassa olevaa paria jokaista suuntaa kohden:
calibrationPanel.xAndYPrintingCircle=Robox tarkistaa nyt kohdistuksen tulostamalla ympyrän vasempaan yläkulmaan.
calibrationPanel.xAndYPrintCircleCheck=Hienosuuttimen ristin pitäisi olla täsmälleen täyttösuuttimen ristin keskellä. Jos ristit eivät ole hyvin linjassa, täytyy kalibrointi suorittaa uudelleen. Kun olet tyytyväinen, klikkaa Seuraava jatkaaksesi.
dialogs.automakerErrorNo3DSupport=Tämä kone ei omaa 3D-tuen vaadittua tasoa tämän sovelluksen suorittamiseksi. Löydät lisätietoa Roboxin tukiportaalin Ratkaisut-kohdasta. Sovellus suljetaan.
