calibrationPanel.calibrationCommencedMessageFine=AutoMaker määrittää seuraavaksi neulaventtiilin avautumispisteen. Venttiili avataan asteittain aina kun painat "Ei nähtävissä".\n\n\n\nPaina toistuvasti "Ei nähtävissä" kunnes näet materiaalia virtaavan ulos, ja paina sitten "Nähtävissä" painiketta.
calibrationPanel.calibrationCommencedMessageFill=Nyt täyttösuutin - näetkö materiaalia pursuavan?\n\n\n\nPaina toistuvasti 'Ei nähtävissä' painiketta kunnes näet materiaalia, paina sitten 'Nähtävissä' painiketta.
