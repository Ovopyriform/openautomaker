profileLibraryHelp.name=Profiilin nimi
profileLibraryHelp.slicerChooser=Valite käytettävä siivutus ohjelmisto.
profileLibraryHelp.layerHeight=This setting defines the layer height (essentially the print resolution) of the printed object. Users can select from any value between 20-400μm, however this setting will dramatically affect print time.
profileLibraryHelp.fillDensity=Kappaleen sisäinen täyttöaste. !00% tarkoittaa täysin kiinteää ja 0% täysin onttoa.
profileLibraryHelp.fillPattern=Tällä asetuksella valitaan sisäosien täyttökuviointia.
profileLibraryHelp.infillEveryN=This setting forces Robox® to add a solid infill layer every n layers. To disable this option, enter 0.
profileLibraryHelp.solidLayersTop=Kerrosten määrä mallin päällä. Voit joutua lisäämään kerrosten määrä, jos tulostat esineitä joiden päälipinta on suuri. Tällä vältät repeämät ulkopinnassa.
profileLibraryHelp.solidLayersBottom=Pohjan umpinaisten kerrosten määrä kappaleessa. Voit joutua suurentamaan tätä arvoa jos kappale kasvaa vaakasuunnassa jotta pohjaan ei jää rakoja.
profileLibraryHelp.numberOfPerimeters=Kappaleen ulkoseinien kerrosten määrä, suurempi kerrosten lukumäärä tarkoittaa paksumpia seiniä.
profileLibraryHelp.firstLayerExtrusionWidth=Yhden viivan leveys ensimmäisen tulostuskerroksen aikana (mm), koskee vain varsinaista tulostetta.
profileLibraryHelp.perimeterExtrusionWidth=Yhden viivan leveys (mm) kun tulostetaan kappaleen seinämiä. Esim kappaleen ulkoseinät.
profileLibraryHelp.infillExtrusionWidth=Yhden viivan leveys (mm) kun tulostetaan ei kiinteää sisäkerrosta, esimerkiksi alimman ja ylimmän pinnan välinen täyte.
profileLibraryHelp.solidInfillExtrusionWidth=Yhden viivan leveys (mm) kun tulostetaan täyttä kerrosta, esim pohja ja päälikerrokset.
profileLibraryHelp.topSolidInfillExtrusionWidth=This setting changes the width of a single line of extrusion (mm) when printing the last top layer i.e. the top of the model’s exposed surfaces.
profileLibraryHelp.supportExtrusionWidth=Yhden viivan leveys tukirakenteessa (mm).
profileLibraryHelp.nozzleEjectionVolume=Neulan syrjäyttämä materiaalin määrä. Neulan sulkeutuessa sen syrjäyttää pienen määrän tulostusmateriaalia.
profileLibraryHelp.nozzlePartialOpen=Venttiilin liikkeen suhde, esim arvo 0,5 tarkoittaa avautumista vain puoleen väliin.
profileLibraryHelp.supportOverhangThreshold=Tämä kulma määrittää reunan yli menevän kulman, jolle tukimateriaali tulostetaan. Antamalla arvo '0' Automaker määrittää sopivan kulman automaattisesti.
profileLibraryHelp.supportPattern=Tukimateriaalin kuvio, joillakin kuvioilla tuen tarve on vähäisempää ja täten tulostusaika pienenee.
profileLibraryHelp.supportPatternSpacing=Tämä määrittää tukimateriaalin välyksen millimetreissä,toisinsanoen tukimateriaalin tiheyden.
profileLibraryHelp.supportPatternAngle=Tuki rakenteiden tulostussuunnan kääntö XY-tasossa.
profileLibraryHelp.firstLayerSpeed=Ensimmäisen tulostuskerroksen liikenopeus (mm/s)
profileLibraryHelp.perimeterSpeed=Nopeus jolla kappaleiden reunat tulostetaan (seinämät), mm/s.
profileLibraryHelp.smallPerimeterSpeed=Tämä parametri määrittää tarkkojen reunojen tulostusnopeuden (esim avaukset, ulokkeet ja tarkat yksityiskohdat), nopeus määritetään yksikössä mm/min. Suositellaan käytettävän hitaampaa arvoa kuin ”kehysten tulostus nopeus” jotta yksityiskohtien laatu paranee.
profileLibraryHelp.externalPerimeterSpeed=Mallin ulkopuolisten reunojen tulostusnopeus, arvona mm / sekunti.
profileLibraryHelp.infillSpeed=Täytön, kappaleen sisäosien, nopeus (mm/s). Parhaan tuloksen saavuttamiseksi nopeus tulisi säätää raja-arvoon jossa tulostus jälki ei repeä. Repeämä voi aiheuttaa ongelmia kappaleen kestävyyden kanssa.
profileLibraryHelp.solidInfillSpeed=Nopeus jota käytetään täysien kerrosten tulokseen (kappaleen pohja ja muut täyden kerrokset), nopeus mm/s
profileLibraryHelp.TopSolidInfillSpeed=Päälikerrosten tulostusnopeus (mm/s), yleensä käytetään hieman muuta tulostusta hitaampaa nopeutta jotta päälikerroksen pinnanlaatu saadaan paremmaksi. Tällä on myös vaikutusta pintakerrosta edeltäviin kerroksiin jotka mahdollistavat tasaisen päälipinnan.
profileLibraryHelp.supportMaterialSpeed=Tukimateriaalin tulostusnopeus, mm/s. Tämän tulisi olla maksimiarvo, jolla tukirakenne pysyy yhtenäisenä.
profileLibraryHelp.raftBaseLinewidth=Yhden viivan leveys tukipohjan ensimmäisen tulostuskerroksen aikana (mm).
profileLibraryHelp.raftAirGapLayer0=Tukipohjan päälipinnan ja kappaleen pohjan ensimmäisen kerroksen välinen etäisyys (mm)
profileLibraryHelp.interfaceLayers=Tällä asetuksella määirtetään pohjatulostuksen umpinaisen kerrosten määrä enen varsinaisen mallin tulostustamista.
profileLibraryHelp.bridgesSpeed=Siltojen (tukemattomat kahden pinnan väliset matkat) tulostusnopeus. Siltojen ylitysmatka riippuu materiaalista ja jäähdytyksestä. Liian pieni nopeus aiheuttaa vajoamista, liian suuri vedon katkeamista. Yleensä sillat tulostetaan reunoja hitaammin.
profileLibraryHelp.interfaceSpeed=This parameter sets the speed at which interface material is printed in millimetres per second.
profileLibraryHelp.gapFillSpeed=Pienten ylitysten tulostusnopeus (mm/s). Pienten aukkojen tulostus voi aiheuttaa tulostus pään värinää ja tämä värinä voi aiheuttaa vaurioita kappaleen muihin osiin. Antamalla tarpeeksi pieni nopeusarvo voidaan estää värinää pienten ylitysten täytössä. Arvo '0' estää pienten ylitysten täytön.
profileLibraryHelp.enableAutoCooling=This setting is used to enable or disable automatic cooling for 3D prints. AutoMaker™ uses one of two methods to control cooling - it can either increase the fan speed or slow down the time to print a layer. The choice of which method is used is controlled by 'Enable Fan if Layer Time <' and 'Go Slow if Layer Time <'.
profileLibraryHelp.minFanSpeed=Puhaltimen pienin teho, %:ia maksimitehosta.
profileLibraryHelp.maxFanSpeed=Puhaltimen maksiminopeus %
profileLibraryHelp.bridgesFanSpeed=Puhaltimen nopeus siltatulostuksen aikana, arvo prosentteja täydestä tehosta.
profileLibraryHelp.disableFanFirstNLayers=Puhallus pois ensimmäisen n kerroksen ajaksi, tämä voi parantaa tulostuksen tartuntaa alustaan. Suositellaan puhalluksen pois jättämistä yhden tai kahden ensimmäisen kerroksen ajaksi.
profileLibraryHelp.enableFanLayerTimeBelow=Aika jota nopeammin tulostettavissa kerroksissa käytetään maksimipuhallusta.
profileLibraryHelp.slowFanLayerTimeBelow=Tulostusnopeuden hidastus jos kerroksen kuluu aikaa alle määritetyn ajan (sekuntia)
profileLibraryHelp.minPrintSpeed=Hitain mahdollinen nopeus kerroksen aikana (mm/s)
