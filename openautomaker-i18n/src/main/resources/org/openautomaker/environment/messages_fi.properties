readyToBeginNozzleOpeningCalibration=Tämä testi kalibroi neulaventtiilin aukeamiskohdan. Varmista että SmartReel materiaali on asennettuna koneeseen, tarvitset pinsetit. Testi syöttää materiaalia tulostuspäähän ja sulattaa sen. Jokaisen venttiilin kohdalla sinulta kysytään pusertuuko materiaalia ulos, testi avaa suuttimen vähän kerrallaan ja pyytää sinua tarkistamaan materiaalin virtauksen kussakin vaiheessa. Kun olet vahvistanut että materiaali virtaa suuttimesta, arvot tallennetaan ja testi jatkuu.
