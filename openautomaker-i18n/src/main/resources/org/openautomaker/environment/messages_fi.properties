filamentLibraryHelp.ambientTemp=Suljetus tulostustilan lämpötila. Pitämällä tulosteen ympäristön lämpötila vakiona voidaan vähentää kappaleen kutistumista ja vääntymistä. Paras lopputulos saavutetaan kun kappaleen lämpötila pysyy tasaisena koko tulostuksen ajan. Vasta valmista kappaletta jäähdytetään hallitusti. Vääntyminen johtuu usein kappaleen eri osien välisistä lämpötila eroista, jolloin osa kappaleesta kutistuu suhteessa toiseen.
filamentLibraryHelp.material=Materiaalin tyyppi
filamentLibraryHelp.diameter=Filamentin halkaisija millimetreissä, mittaukseen on suositeltavaa käyttää työntömittaa tai mikrometria riittävän tarkkuuden saavuttamiseksi.
filamentLibraryHelp.multiplier=Materiaalin kokoonpuristuvuuden kompensointi, kun filamentti kulkee syöttimen lävitse materiaali voi puristua hieman kokoon. Tämä voi vaikuttaa syötetyn materiaalin määrään, mitä kovempi materiaali sitä lähempänä arvoa 1 tulisi olla.
filamentLibraryHelp.feedRateMultiplier=Materiaalin syötön hienosäätö, voidaan säätää tulostuksen aikana jotta saavutetaan paras mahdollinen tulostus jälki. Arvon nosto yli yhden tarkoittaa suurempaa materiaalin syöttömäärää ja päinvastoin. 2 tarkoittaa kaksinkertaista materiaalin syöttöä. Oikea arvo vaihtelee materiaalien välillä ja säätö tulisi tehdä pienillä askeleilla (esim  0,05) koska vaikutus lopulliseen kappaleeseen on erittäin suuri.
filamentLibraryHelp.firstlayerBedTemp=Alustan lämpötila ensimmäisen kerroksen tulostuksen aikana, korkeammalla lämpötilalla saavutetaan parempi tartunta. Lämpötilaa tulisi laskea muiden kerrosten ajaksi jotta kappale ei ”vajoa” pohjasta.
filamentLibraryHelp.bedTemp=This value sets the temperature of the print bed surface during a print. A heated bed will help to reduce warping and improve adhesion of a wide range of materials. ABS requires a bed temperature of approximately 110°C for good adhesion, whereas PLA only requires 60-80°C.
filamentLibraryHelp.firstLayerNozzleTemp=Ensimmäisen kerroksen suuttimen lämpötila. Korkeammalla lämpötilalla pyritään varmistamaan hyvä tartunta tulostuksen alussa, lämpötilaa voidaan laskea ensimmäisen kerroksen jälkeen.
filamentLibraryHelp.nozzleTemp=This value sets the temperature of the nozzle used for printing the material. Different thermoplastics require different nozzle temperatures due to their differing melting points (or more accurately, glass transition temperatures). For example, most ABS requires a nozzle temperature of 240°C, whereas PLA only requires 200°C to print successfully.
