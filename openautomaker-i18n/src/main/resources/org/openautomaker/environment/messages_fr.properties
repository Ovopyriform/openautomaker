calibrationPanel.calibrationCommencedMessageFine=AutoMaker doit maintenant déterminer le« point d'ouverture »de l’aiguille de la valve. La valve s’ouvre progressivement à chaque fois que vous cliquez sur 'Non présent’.\n\n\n\n\n\n\n\nAppuyez plusieurs fois sur le bouton ‘non présent’ jusqu'à ce que la matière coule, ensuite appuyez sur le bouton 'Present'
calibrationPanel.calibrationCommencedMessageFill=Maintenant, le bec de remplissage / voyez-vous de la matière sortir?               Appuyez plusieurs fois sur le bouton : "Non présent" jusqu'à ce que de la matière coule, ensuite pressez le bouton :"Présent"
calibrationPanel.calibrationSucceededMessage=Calibration réussie! La configuration de la tête d'impression de votre Robox a été mise à jour.
calibrationPanel.cancelCalibration=Annuler
calibrationPanel.chooseCalibration=Merci de choisir le type de calibration requise
calibrationPanel.chooseNozzleOffsetMode=Choisir une option
calibrationPanel.ensureHeadIsCleanBMessage=Assurez-vous que les buses d’impressions soient propres - utiliser une pince à épiler pour enlever la matière présente à la base de la buse afin d’assurer un bon écoulement de la matière lorsqu'elle sera éjectée.
calibrationPanel.present=Présent
calibrationPanel.headCleanCheck=Avant de passer à la prochaine étape, veuillez enlever toute matière restante avec une pince à épiler. Cliquer sur Suivant pour continuer
calibrationPanel.heating=AutoMaker  chauffe maintenant la tête d’impression en préparation à la calibration. Merci de patienter…
calibrationPanel.initialisingOffset=Avant de commencer l’étape de calibration, veuillez enlever le plateau d’impression en glissant le loquet de fermeture (surligné) vers la gauche, enlevez la raclette d’essuyage pour ensuite soulever la plaque en la faisant glisser vers vous. Munissez vous d’une petite feuille de papier pour la calibration ainsi que d'une pince a épiler pour enlever le surplus de filament.
calibrationPanel.insertPieceOfPaper=Disposez le morceau de papier sous la buse gauche (fin). Cliquer sur suivant, Robox fera descendre la buse pour s’appuyer délicatement sur le papier.
calibrationPanel.isMaterialExtrudingNozzle0=Est ce que de la matière sort de la buse fine (gauche)?
calibrationPanel.isMaterialExtrudingNozzle1=Est ce que de la matière sort de la buse (coté droit) de remplissage?
calibrationPanel.justRight=Juste à droite
calibrationPanel.measuringZOffset=Robox va maintenant déterminer les différence de hauteur entre les deux buses..veuillez patienter…
calibrationPanel.moveThePaperInstruction=Utilisez les flèches haut et bas pour régler la hauteur de la tête d’impression. Trouvez la position la plus basse que permet au papier de glisser librement sous les becs sans les toucher.\n\n\n\nLorsque vous avez trouvé ce point, cliquez sur suivant pour terminer l'étalonnage .
calibrationPanel.notPresent=Non présent
calibrationPanel.nozzleCalibrationFailed=«Désolé, il semble que l’étalonnage de l'ouverture des becs a échoué.\n\n\n\nAvant de nous contacter, répéter le calibrage en étant sûr que vous avez lu et suivi attentivement les instructions. S’assurer ensuite que les becs sont propres et que la matière s’écoule librement avec fluidité sur les deux becs - en cas de doute, exécutez la séquence de purge à nouveau (en maintenance).\n\n\n\nSi l’étalonnage d’ouverture des becs échoue à plusieurs reprises Regarder les solutions disponibles à http://robox.freshdesk.com - si vous ne parvenez toujours pas à résoudre votre problème, veuillez ouvrir un ticket de support, nous vous contacterons dès que nous le pouvons ".
calibrationPanel.nozzleOffsetCalibrationTitle=Calibration offset de la buse
calibrationPanel.primingNozzle=Amorçage de la buse
calibrationPanel.readyToBeginNozzleOffsetCalibration=Si vous rencontrez des problèmes d’adhérence ou des incohérences dans les hauteurs des premières couches, compléter cette alors le cycle de calibration.\n\n\n\nComme la tête d'impression change d’un bec a l’autre, le bec qui n’imprime pas est levé hors de la voie de l'impression. Par conséquent, le logiciel a besoin de connaître la différence de hauteur entre les deux becs quand ils sont dans leur position d'impression. Cette routine permet de calibrer la hauteur de levage.
calibrationPanel.readyToBeginNozzleOpeningCalibration=This routine is used to calibrate the point at which the needle valves in the head operate. The firmware has to know the point at which the plastic begins to flow in order to accurately control extrusion.\n\nBefore beginning the calibration sequence ensure that the bed is clear of objects, the nozzles are clean and you have a SmartReel loaded. A pair of tweezers/small pliers would also be helpful for removing waste filament.
calibrationPanel.recalibrate=Recalibrer
calibrationPanel.replacePEIBed=Remplacer la plateforme PEI en la faisant glisser dans les rails tout envous assurant que la surface est en dessous des clips sur les cotés. Faire glisser la plateforme jusqu’au fond et pousser le loquet de fermeture vers la droite (surligné) pour sécuriser la position de cette dernière. Pour finir réinsérer la raclette de nettoyage et cliquer sur suivant pour compléter la calibration. 
calibrationPanel.retryCalibration=Réessayer
calibrationPanel.saveSettings=Sauvegarder les paramètres
calibrationPanel.startCalibration=Commencer
calibrationPanel.stepXOf2=Etape %s à 2
calibrationPanel.stepXOf7=Etape %s à 7
calibrationPanel.stepXOf9=Etape %s à 9
calibrationPanel.title=Calibration
calibrationPanel.tooLoose=Trop lâche
calibrationPanel.tooTight=Trop serré
calibrationPanel.valvesClosedNoMaterial=Maintenant, les becs sont chauffés, vous devez vérifier si les becs sont complètement scellés lorsque la valve est complètement fermée.\n\n\n\nVoyez-vous de la matière sortir du bec?
calibrationPanel.valvesClosedNoMaterialPostCalibration=AutoMaker va maintenant vérifier le calibrage.
calibrationPanel.valvesOpenMaterialExtruding=Maintenant les buses s'ouvrent - vous devriez voir de la matière sortir de ces dernières. Est-ce correct?
calibrationPanel.xAndYIntroduction=Si vous rencontrez des problèmes de remplissage t/ou les détails d’impression sont mal alignées, compléter alors la séquence de calibrage suivante.\n\n\n\nCette routine est utilisée pour définir l'alignement des deux becs d’impression sur l’axe X et Y . Ceci permet d’informer RoboX sur l'emplacement de chaque bec par rapport à l'autre .\n\n\n\nVous assurer que la plateforme est propre et dégagée de tout obstacle, les séquence “d’ouverture des becs” et de”calibration des hauteurs” sont terminées et vous avez un SmartReel chargé et prêt à imprimer. Si vous avez du PLA a disposition, il est recommandé de l’utiliser.
calibrationPanel.xAndYPrintPattern=AutoMaker va maintenant imprimer un modèle de calibration - veuillez patienter
calibrationPanel.xAndYGetOffsets=Retirez l’impression de la plateforme et cherchez le meilleur alignement entre les lignes créées par chaque buses (remplissage et fin) sur les axes X et Y. Entrez ensuite le numéro et la lettre correspondant à la paire la mieux alignée dans les cases ci-dessous:
calibrationPanel.xAndYPrintingCircle=Robox va maintenant imprimer un motif de test circulaire afin de vérifier la procédure d'alignement.
calibrationPanel.xAndYPrintCircleCheck=La buse fine devrait se trouver exactement au centre de l’axe de la buse de remplissage. Si ce n'est pas bien aligné, exécutez à nouveau la calibration. Si vous êtes satisfait, cliquez sur Suivant pour continuer.
dialogs.automakerErrorNo3DSupport=Cette machine n’as pas le niveau de support 3D requis pour faire fonctionner cette application. Veuillez vous référer à la zone ‘Solutions’ sur le portail de support Robox pour plus d’information, l’application va maintenant être fermée.
