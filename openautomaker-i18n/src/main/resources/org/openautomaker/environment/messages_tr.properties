calibrationPanel.isMaterialExtrudingNozzle1=Malzeme doğru ağızlıktan mı geliyor?
calibrationPanel.justRight=Sadece doğru
calibrationPanel.measuringZOffset=Robox artık iki nozul arasındaki yükseklik farkını belirliyor. Lütfen bekle..
calibrationPanel.moveThePaperInstruction=Kafanın yüksekliğini ayarlamak için yukarı ve aşağı okları kullanın. Kağıdın nozulların altına dokunmadan serbestçe kaymasını sağlayan en düşük konumu bulun. Bu noktayı bulduğunuzda, kalibrasyonu tamamlamak için İleri'yi tıklayın.
calibrationPanel.notPresent=Mevcut değil
calibrationPanel.nozzleCalibrationFailed=Maalesef nozul açılış kalibrasyonu başarısız görünüyor. Bizimle iletişime geçmeden önce lütfen talimatları dikkatli bir şekilde okuyup takip ettiğinizden emin olarak kalibrasyonu tekrarlayın. nozüllarin temiz olduğundan ve malzemenin her iki nozülden iyi temiz bir çıkışla serbestçe aktığından emin olun - şüpheniz varsa, temizleme sırasını tekrar çalıştırın (Bakımda). Ürününüz kalibrasyon testlerini tekrar tekrar başarısız olursa, lütfen <a href="http://www.cel-robox.com/support/">Robox Support Portal</a> 'nda bulunan çözümlere bakın. Sorununuzu hala çözemiyorsanız, lütfen bir destek bileti alın ve mümkün olan en kısa sürede iletişime geçeceğiz.
calibrationPanel.nozzleOffsetCalibrationTitle=Nozzle ofset kalibrasyonu
calibrationPanel.primingNozzle=Hazırlama nozulu
calibrationPanel.readyToBeginNozzleOffsetCalibration=Yatağa yapışmayan malzama ile ilgili sorun yaşıyorsanız veya yazdırılmış olan ilk birkaç katmanın yüksekliğindeki tutarsızlıklar varsa, lütfen bu kalibrasyon sırasını tamamlayın. Yazılım, her bir nozul arasındaki yükseklik farkını dikkate almalıdır, çünkü diğeriyle paraziti önlemek için baskı yapılmayan nozul yükseltilmelidir. Bu kalibrasyon işlemi bu yükseklik farkını hesaplar.
calibrationPanel.readyToBeginNozzleOpeningCalibration=Bu rutin, kafadaki iğne vanalarının çalıştığı noktayı kalibre etmek için kullanılır. Ürün yazılımı, ekstrüzyonu doğru bir şekilde kontrol etmek için plastiğin akmaya başladığı noktayı bilmek zorundadır. Kalibrasyon sırasına başlamadan önce yatağın nesnelerden uzak olduğundan emin olun, nozullar temiz ve SmartReel yüklü. Bir çift cımbız / küçük pense de atık filamenti gidermek için yararlı olacaktır.
calibrationPanel.recalibrate=yeniden kalibre
calibrationPanel.replacePEIBed=PEI yatağını önce tepsiye kaydırarak, yüzeyin her taraftaki klipslerin altında kalmasını sağlayın. Arkayı sonuna kadar kaydırın ve sonra yerine sabitlemek için kilitleme tutamacını (vurgulanan) sağa doğru hareket ettirin. Son olarak, uç silme bıçağını tekrar takın ve kalibrasyonu tamamlamak için İleri'yi tıklayın.
