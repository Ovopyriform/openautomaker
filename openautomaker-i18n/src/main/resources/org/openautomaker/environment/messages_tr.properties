calibrationPanel.headCleanCheck=Bir sonraki adıma geçmeden önce, ekstrüde edilmiş malzemeleri cımbız kullanarak çıkarın. Devam etmek için İleri'yi tıklayın.
calibrationPanel.heating=AutoMaker artık yazıcı kafasını kalibrasyon için hazırlık aşamasında ısınıyor - lütfen bekleyin ...
calibrationPanel.initialisingOffset=Kalibrasyona başlamadan önce, kilitleme kolunu (vurgulanan) sola hareket ettirerek, uç silme bıçağını çıkartarak ve ardından kağıdı kaldırarak kendinize doğru kaydırarak yazıcı yatağını çıkarın. Kalibrasyon için küçük bir düz kağıt tabakasına ihtiyacınız olacak ve bir çift cımbız / küçük pense de atık filamenti gidermek için faydalı olacaktır.
calibrationPanel.insertPieceOfPaper=Sol nozulu altına bir parça kağıt yerleştirin. Ardından Next (İleri) 'ye tıklayın ve Robox, kağıt yaprağını kavramak için aşağı doğru hareket edecektir.
