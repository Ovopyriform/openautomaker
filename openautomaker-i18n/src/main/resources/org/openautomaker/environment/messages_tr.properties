calibrationPanel.tooTight=Çok sıkı
calibrationPanel.valvesClosedNoMaterial=Şimdi nozullar ısıtılır, supaplar tamamen kapandığında nozulların tamamen kapatılıp kapatılmadığını kontrol etmeniz gerekir. Nozuldan gelen herhangi bir malzeme görüyor musunuz?
