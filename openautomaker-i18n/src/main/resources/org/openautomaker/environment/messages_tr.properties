calibrationPanel.xAndYIntroduction=Baskının yanlış hizalanmış kısımlarında sorun yaşıyorsanız, lütfen bu kalibrasyon sırasını tamamlayın. Bu rutin, iki baskı nozulunun X ve Y yönündeki hizalamasını ayarlamak için kullanılır. Bu, Robox'ın her bir nozulun yerini diğerine göre bilmesini sağlar. Yatağın temiz ve tıkanıklıklardan uzak olduğundan emin olunuz, nozul açıklığı ve nozul yükseklik kalibrasyonlarını tamamladınız ve SmartReel yüklü ve baskıya hazırsınız. PLA mevcutsa, bunu kullanmanız önerilir.
calibrationPanel.xAndYPrintPattern=AutoMaker artık bir kalibrasyon kalıbı basacaktır - lütfen bekleyin ...
calibrationPanel.xAndYGetOffsets=Baskıyı yataktan çıkarın ve X ve Y eksenlerindeki her bir nozülden çıktı arasındaki en iyi hizalamayı bulun. Aşağıdaki kutularda her yön için en iyi hizalanmış çifte karşılık gelen sayı ve harfi girin:
calibrationPanel.xAndYPrintingCircle=Robox, hizalama prosedürünü doğrulamak için şimdi dairesel bir test deseni basacaktır.
calibrationPanel.xAndYPrintCircleCheck=İlk nozul çaprazı, ikinci nozul çaprazının tam ortasına uzanmalıdır. Bu iyi hizalanmamışsa, kalibrasyon prosedürünü tekrar çalıştırmanız gerekir. Memnun kalırsanız, devam etmek için İleri'yi tıklayın.
