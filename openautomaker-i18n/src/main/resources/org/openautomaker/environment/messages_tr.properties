readyToBeginNozzleOpeningCalibration=Bu test, igne valfi açik noktasini ayarlayacaktir. Robox'a yüklenen bir SmartReel malzemesine ve bir çift cimbiza ihtiyaciniz olacak. Test malzemeyi kafasina besleyecek ve eritecektir. Her bir valf için, malzemenin akip gitmedigi sorulacaktir. Test, nozulu küçük artislarla açacak ve her asamada malzeme akisi için kontrol etmenizi isteyecektir. Dogruladiktan sonra degerler akiyor ve degerler kaydedilecek ve test devam edecektir.
